[package]
name = "duty-scheduler"
version = "0.1.0"
edition = "2021"

[dependencies]
diesel = { version = "2.2", features = ["sqlite", "r2d2", "chrono"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
chrono = { version = "0.4", features = ["serde"] }
diesel_migrations = "2.2"
rand = "0.8"
